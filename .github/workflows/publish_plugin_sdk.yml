name: Publish Plugin SDK

on:
  push:
    tags:
      - 'plugin-sdk-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Test and publish AAR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag matches SDK version
        run: |
          SDK_VERSION="$(awk -F= '$1 == "pluginSdkVersion" { print $2 }' gradle.properties)"
          test "$GITHUB_REF_NAME" = "plugin-sdk-v$SDK_VERSION"

      - name: Test and publish Plugin SDK
        run: >-
          ./gradlew --no-daemon --stacktrace
          :core:plugin-api:test
          :core:plugin-api:lint
          :core:plugin-api:publishPluginSdkPublicationToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload published AAR
        uses: actions/upload-artifact@v7
        with:
          name: plugin-sdk-${{ github.run_attempt }}
          path: core/plugin-api/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 14
